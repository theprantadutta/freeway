services:
  freeway:
    image: freeway
    container_name: freeway-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freeway.rule=Host(`freeway.pranta.dev`)"
      - "traefik.http.routers.freeway.entrypoints=websecure"
      - "traefik.http.routers.freeway.tls.certresolver=letsencrypt"
      - "traefik.http.services.freeway.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Wraps the host's Claude Code so the premium lane can be served from a
  # subscription instead of a paid model.
  #
  # Optional: comment the whole service out and Freeway carries on using paid models.
  # It publishes no ports and is not on the proxy network, so it is reachable only
  # from other services here — which is why it needs no shared token.
  #
  # CLAUDE_HOME must point at the directory holding your Claude credentials, and
  # CLAUDE_UID/GID must match whoever owns them (`id -u`, `stat -c %u ~/.claude`).
  # The mounts are read-write on purpose: Claude Code refreshes its OAuth token and
  # writes session state, so a read-only mount works until the token expires.
  claude-bridge:
    image: freeway-claude-bridge
    container_name: freeway-claude-bridge
    build:
      context: ./deploy/claude-bridge
      dockerfile: Dockerfile
    user: "${CLAUDE_UID:-1000}:${CLAUDE_GID:-1000}"
    volumes:
      - ${CLAUDE_HOME:-/home/ubuntu}/.claude:/home/claude/.claude
      - ${CLAUDE_HOME:-/home/ubuntu}/.claude.json:/home/claude/.claude.json
    environment:
      - BRIDGE_MAX_CONCURRENT=1
      - BRIDGE_TIMEOUT_MS=120000
      - BRIDGE_HEALTH_TTL_MS=600000
      # How much of the subscription this may spend per rolling hour, and the share
      # of it the moderate lane may take. The ceiling cannot be discovered from the
      # CLI, so it is a budget you set -- see deploy/claude-bridge/README.md.
      - BRIDGE_HOURLY_TOKEN_BUDGET=${BRIDGE_HOURLY_TOKEN_BUDGET:-200000}
      - BRIDGE_SPILLOVER_SHARE=${BRIDGE_SPILLOVER_SHARE:-0.6}
    restart: unless-stopped
    networks:
      - internal

  freeway-web:
    image: freeway-web
    container_name: freeway-web
    build:
      context: ./src/Freeway.Web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://freeway.pranta.dev
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freeway-web.rule=Host(`freewayapp.pranta.dev`)"
      - "traefik.http.routers.freeway-web.entrypoints=websecure"
      - "traefik.http.routers.freeway-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.freeway-web.loadbalancer.server.port=3243"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3243/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      freeway:
        condition: service_healthy

networks:
  proxy:
    external: true
  # Private to this compose project: the bridge is only reachable from the API.
  internal:
    driver: bridge
